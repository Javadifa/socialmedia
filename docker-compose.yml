#container name -->social_media_database
#5434: outer port what we send our request on local machine
#5432 --> on docker itself
# todo : write docker compose
#seems like in new school versioning is  not required

services:
  db:
    image: postgres:latest
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


